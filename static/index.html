<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МИРЭА RAG Бот</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #232735;
    --accent: #4a9eff;
    --text: #e4e6eb;
    --text-dim: #8b8f9a;
    --user-bg: #2b5a8e;
    --bot-bg: #232735;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #4ade80;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
  }
  header .stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--user-bg);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: var(--bot-bg);
    border: 1px solid rgba(255,255,255,0.05);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .sources {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
    color: var(--text-dim);
  }
  .msg.bot .sources a { color: var(--accent); text-decoration: none; }
  .msg.bot .meta {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .msg.typing {
    color: var(--text-dim);
    font-style: italic;
  }
  .typing span {
    animation: blink 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.3; }
    30% { opacity: 1; }
  }
  #input-bar {
    background: var(--surface);
    padding: 14px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-dim); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #send:active { transform: scale(0.97); }

  /* Scrollbar */
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>МИРЭА RAG Бот</h1>
  <div class="stats" id="stats">Gemma 4 E2B · 1459 чанков</div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <input id="input" type="text" placeholder="Задайте вопрос о МИРЭА..." autocomplete="off" autofocus>
  <button id="send">Отправить</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const chatHistory = [];  // [{role, content}] — last turns for conversational memory
const MAX_HISTORY = 4;   // 2 user+assistant pairs

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping() {
  return addMsg('bot typing', '<span>●</span><span>●</span><span>●</span> думаю...');
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendBtn.disabled = true;

  addMsg('user', escapeHtml(q));
  const typing = addTyping();

  try {
    const t0 = performance.now();
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, history: chatHistory }),
    });
    const data = await resp.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    typing.remove();

    if (!resp.ok) {
      addMsg('bot', `⚠️ Ошибка: ${data.detail || resp.statusText}`);
      return;
    }

    let html = escapeHtml(data.answer);

    // Sources
    if (data.sources && data.sources.length) {
      let srcHtml = '<div class="sources">📎 Источники:<br>';
      for (const s of data.sources) {
        const score = s.score ? ` (${(s.score * 100).toFixed(0)}%)` : '';
        const link = s.url ? `<a href="${escapeHtml(s.url)}" target="_blank">${escapeHtml(s.url)}</a>` : '';
        srcHtml += `• [${escapeHtml(s.section || '?')}]${score} ${link}<br>`;
      }
      srcHtml += '</div>';
      html += srcHtml;
    }

    // Meta
    html += `<div class="meta">⏱ ${elapsed}с · чанков: ${data.context_chunks} · scores: ${(data.retrieval_scores || []).map(s => s.toFixed(3)).join(', ')}</div>`;

    addMsg('bot', html);

    // Save to conversation memory (cap at MAX_HISTORY turns)
    chatHistory.push({ role: 'user', content: q });
    chatHistory.push({ role: 'assistant', content: data.answer });
    while (chatHistory.length > MAX_HISTORY) chatHistory.shift();
  } catch (e) {
    typing.remove();
    addMsg('bot', `⚠️ Не удалось подключиться к серверу: ${e}`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

sendBtn.addEventListener('click', ask);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    ask();
  }
});
</script>

</body>
</html>
